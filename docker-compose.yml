services:
  wordword:
    build: .
    container_name: wordword
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://wordword:wordword@db:5432/wordword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: wordword-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=wordword
      - POSTGRES_PASSWORD=wordword
      - POSTGRES_DB=wordword
    volumes:
      - wordword-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordword -d wordword"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wordword-db:
