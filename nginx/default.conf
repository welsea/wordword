# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    # Change this to your domain name.
    server_name example.com www.example.com;

    # Let's Encrypt uses this path to verify your domain (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Send all other traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: serve the app ----
server {
    listen 443 ssl;
    http2 on;
    # Change this to your domain name.
    server_name example.com www.example.com;

    # Change these paths to your certificate files.
    # These are the default Let's Encrypt locations.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Reasonable modern defaults. You can tweak these.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        # The app container publishes port 3000 on localhost (see docker-compose.yml).
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Forward the real host and client info to the app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Allow websockets / HMR-style upgrades if ever needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
